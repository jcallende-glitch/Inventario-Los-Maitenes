window.cargarInventario = async function() {
  const btn = document.getElementById("btn-cargar");
  const log = document.getElementById("log");
  btn.disabled = true;
  btn.textContent = "Cargando...";
  log.innerHTML = "";

  let ok = 0, err = 0;

  for (const p of PRODUCTOS) {
    try {
      await addDoc(collection(db, "productos"), {
        ...p,
        stockMinimo: 0,
        precio: 0,
        ingredienteActivo: "",
        fabricante: "",
        proveedor: "",
        cultivosCompatibles: "",
        etiquetaUrl: "",
        hojaUrl: "",
        ts: Date.now(),
      });
      ok++;
      log.innerHTML += `<div style="color:#16a34a;font-size:12px">✓ ${p.nombre}</div>`;
    } catch(e) {
      err++;
      log.innerHTML += `<div style="color:#dc2626;font-size:12px">✗ ${p.nombre}: ${e.message}</div>`;
    }
    log.scrollTop = log.scrollHeight;
  }

  btn.textContent = `Listo — ${ok} cargados${err > 0 ? `, ${err} errores` : ""}`;
  document.getElementById("resultado").innerHTML = `
    <div style="background:#dcfce7;border:1px solid #86efac;border-radius:10px;padding:16px;margin-top:16px;text-align:center">
      <div style="font-size:24px;margin-bottom:8px">✅</div>
      <div style="font-weight:700;color:#16a34a">${ok} productos cargados exitosamente</div>
