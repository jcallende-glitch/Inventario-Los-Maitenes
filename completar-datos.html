window.enriquecer = async function() {
  const btn = document.getElementById("btn");
  const log = document.getElementById("log");
  const barraRelleno = document.getElementById("barra-relleno");
  const progreso = document.getElementById("progreso");
  btn.disabled = true;
  log.style.display = "block";
  log.innerHTML = `<div style="color:#374151;font-size:13px;margin-bottom:10px">Cargando productos desde Firebase...</div>`;

  const snap = await getDocs(collection(db, "productos"));
  const productos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const total = productos.length;
  let procesados = 0, actualizados = 0, sinDatos = 0;

  log.innerHTML = `<div style="color:#374151;font-size:13px;margin-bottom:10px">📋 ${total} productos encontrados. Actualizando...</div>`;

  for (const p of productos) {
    const datos = DATOS[p.nombre];
    if (datos) {
      await updateDoc(doc(db, "productos", p.id), {
        ingredienteActivo: datos.ingredienteActivo,
        fabricante: datos.fabricante,
        categoria: datos.categoria,
        etiquetaUrl: datos.etiquetaUrl || p.etiquetaUrl || "",
        hojaUrl: datos.hojaUrl || p.hojaUrl || "",
      });
      actualizados++;
      log.innerHTML += `<div style="color:#16a34a;font-size:12px;padding:2px 0;border-bottom:1px solid #f0f4f0">✓ <strong>${p.nombre}</strong> <span style="color:#6b7280">· ${datos.ingredienteActivo} · ${datos.fabricante}</span></div>`;
    } else {
      sinDatos++;
      log.innerHTML += `<div style="color:#9ca3af;font-size:12px;padding:2px 0">— ${p.nombre} (no encontrado en base de datos)</div>`;
    }
    procesados++;
    const pct = Math.round(procesados / total * 100);
    barraRelleno.style.width = pct + "%";
    progreso.textContent = `${procesados} / ${total} (${pct}%)`;
    log.scrollTop = log.scrollHeight;
  }

  btn.textContent = "✅ Completado";
  document.getElementById("resultado").innerHTML = `
    <div style="background:#dcfce7;border:1px solid #86efac;border-radius:10px;padding:20px;margin-top:16px;text-align:center">
      <div style="font-size:28px;margin-bottom:8px">✅</div>
      <div style="font-weight:700;color:#16a34a;font-size:16px">${actualizados} productos actualizados con datos completos</div>
      ${sinDatos > 0 ? `<div style="font-size:13px;color:#b45309;margin-top:4px">${sinDatos} productos sin datos — completalos manualmente en la app</div>` : ""}
      <a href="https://inventariolosmaitenes.netlify.app" target="_blank"
        style="display:inline-block;margin-top:14px;background:#1e3a1e;color:#fff;padding:11px 22px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px">
        Ir al inventario →
      </a>
    </div>`;
}
</script>
